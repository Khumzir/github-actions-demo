services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: ale
      POSTGRES_PASSWORD: ale_dev_password
      POSTGRES_DB: ale
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ale -d ale"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - .:/app
    command: ["sh", "-ec", "cd server && npm install --no-audit --no-fund && exec npm run dev"]
    environment:
      PORT: 8000
      DATABASE_URL: postgres://ale:ale_dev_password@db:5432/ale
      JWT_SECRET: dev_jwt_secret_change_me
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - .:/app
    command: ["sh", "-ec", "cd client && npm install --no-audit --no-fund && exec npm run dev"]
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "true"
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:5173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  db-data:
